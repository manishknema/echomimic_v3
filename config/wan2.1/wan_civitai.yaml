# Wan 2.1 Fun Inpainting Config for EchoMimic V3 Flash Pro

# 1. Main Transformer (1.3B)
transformer_additional_kwargs:
  transformer_subpath: "."
  num_attention_heads: 12
  attention_head_dim: 128
  in_channels: 16
  out_channels: 16
  num_layers: 30
  dropout: 0.0
  cross_attention_dim: 1024
  norm_num_groups: 32
  patch_size: [1, 2, 2]
  window_size: [-1, -1, -1]
  use_gradient_checkpointing: true

# 2. VAE
vae_kwargs:
  vae_subpath: "Wan2.1_VAE.pth"
  in_channels: 3
  out_channels: 3
  latent_channels: 16
  down_block_types:
    - "DownEncoderBlock2D"
    - "DownEncoderBlock2D"
    - "DownEncoderBlock2D"
    - "DownEncoderBlock2D"
  up_block_types:
    - "UpDecoderBlock2D"
    - "UpDecoderBlock2D"
    - "UpDecoderBlock2D"
    - "UpDecoderBlock2D"
  block_out_channels: [128, 256, 512, 512]
  layers_per_block: 2
  act_fn: "silu"
  latent_dim: 16
  sample_size: 512
  temporal_compression_ratio: 4
  spacial_compression_ratio: 8

# 3. Text Encoder (CORRECTED DIMS)
text_encoder_kwargs:
  text_encoder_subpath: "models_t5_umt5-xxl-enc-bf16.pth"
  tokenizer_subpath: "tokenizer"
  model_max_length: 512

  # Architecture Params for UMT5-XXL:
  vocab: 256384
  dim: 4096
  dim_attn: 4096 # <--- CHANGED FROM 64 TO 4096 (Total Dim, not Head Dim)
  dim_ffn: 10240
  num_heads: 64
  num_layers: 24
  num_buckets: 32

# 4. Image Encoder
image_encoder_kwargs:
  image_encoder_subpath: "models_clip_open-clip-xlm-roberta-large-vit-huge-14.pth"

# 5. Scheduler
scheduler_kwargs:
  num_train_timesteps: 1000
  beta_start: 0.00085
  beta_end: 0.012
  beta_schedule: "linear"
  prediction_type: "flow_prediction"
  clip_sample: false
  shift: 1.0
